name: Publish Preview 3

on:
  push:
    tags: ["*"]

permissions:
  contents: read

jobs:
  build-pack:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: windows-2025-vs2026
    env:
      Version: ${{ github.ref_name }}
      Arch: ${{ matrix.arch }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Compile App (Single Arch)
      run: dotnet run publish.cs -- compile --version $env:Version --arch $env:Arch

    - name: Pack (Single Arch, Skip Compile)
      run: dotnet run publish.cs -- pack --version $env:Version --arch $env:Arch

    - name: Upload Artifact (Package, ${{ env.Arch }})
      uses: actions/upload-artifact@v7
      with:
        name: package_${{ env.Version }}_${{ env.Arch }}
        path: |
          publish/release/package/Starward_Setup_${{ env.Version }}_${{ env.Arch }}.exe
          publish/release/package/Starward_Portable_${{ env.Version }}_${{ env.Arch }}.7z
        if-no-files-found: error
        retention-days: 7

  publish-release:
    runs-on: ubuntu-latest
    needs: build-pack
    permissions:
      contents: write

    steps:
    - name: Download packages
      uses: actions/download-artifact@v8
      with:
        pattern: package_${{ github.ref_name }}_*
        merge-multiple: true
        path: packages

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
        files: |
          packages/Starward_Setup_${{ github.ref_name }}_x64.exe
          packages/Starward_Setup_${{ github.ref_name }}_arm64.exe
          packages/Starward_Portable_${{ github.ref_name }}_x64.7z
          packages/Starward_Portable_${{ github.ref_name }}_arm64.7z
